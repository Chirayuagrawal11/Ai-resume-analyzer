spring.application.name=ai-resume-analyzer

spring.datasource.url=jdbc:postgresql://localhost:5432/resume_analyzer
spring.datasource.username=postgres
spring.datasource.password=chirayu

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-secret-key-please}
app.jwt.expiration=86400000

# AI provider. Keep the key outside source code.
ai.api-key=${GEMINI_API_KEY:}
ai.api-url=https://generativelanguage.googleapis.com/v1beta
ai.model=models/gemini-3.6-flash

server.port=8080
